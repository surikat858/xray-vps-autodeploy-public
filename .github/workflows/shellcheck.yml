name: Static checks
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Static source checks
        run: bash scripts/check_source.sh
      - name: ShellCheck critical scripts
        run: |
          shellcheck -S warning install.sh scripts/setup_interactive.sh scripts/block_subscription.sh scripts/server_info.sh scripts/install_login_summary.sh scripts/panel_access.sh scripts/healthcheck.sh scripts/check_source.sh scripts/install_backup_timer.sh scripts/install_cert_hook.sh scripts/backup.sh
      - name: Installation safety contract tests
        run: python3 scripts/test_install_contracts.py
